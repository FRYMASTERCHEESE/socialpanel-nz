name: Verify static panel
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: npm run check
      - name: Run tests
        run: npm test
