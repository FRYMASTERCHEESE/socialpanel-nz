name: Verify static panel
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: npm run check
      - name: Run website tests
        run: npm test
      - name: Check supplier backend syntax
        run: node --check supplier-backend/server.mjs && node --check supplier-backend/admin.js
      - name: Run supplier backend tests
        run: node --test supplier-backend/tests/*.test.mjs
